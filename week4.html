<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Title</title>
</head>

<body>
    <h1>Tables</h1>
    <table>
        <caption>Our First Table</caption>
        <tr>
            <th>Column One</th>
            <th>Column Two</th>
            <th>Column Three</th>
        </tr>
        <tr>
            <td>Freshmen</td>
            <td>Sophomore</td>
            <td>Junior</td>
    </table>
    <h1> Forms</h1>
    <form action="" method="post">
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname"> <br>

        <label for="lname">Last name:</label>
        <input type="text" id="lname" name="lname"> <br> <br> <br>

        <label for="comments">Comments:</label> <br>
        <textarea id="comments" name="comments"></textarea> <br> <br> <br>

        <p>Pick a number:</p>
        <input type="radio" id="number1" name="numbers" value="1"> <label for="number1">1</label> <br>
        <input type="radio" id="number2" name="numbers" value="2"> <label for="number2">2</label> <br>
        <input type="radio" id="number3" name="numbers" value="3"> <label for="number3">3</label> <br> <br> <br>

        <input type ="checkbox" id="vehicle1" name="vehicle1" value="Bike">
        <label for="vehicle1"> I have a bike</label><br>
        <input type ="checkbox" id="vehicle2" name="vehicle2" value="Car">
        <label for="vehicle2"> I have a car</label><br> <br> <br>

        <label for="cars">Choose a car:</label>
        <select name="cars" id="cars">
            <option value="volvo">Volvo</option>
            <option value="saab">Saab</option>
            <option value="mercedes">Mercedes</option>
        </select> <br> <br> <br>

        <input type="submit" value="Send Form">



    </form>
</body>

</html>
