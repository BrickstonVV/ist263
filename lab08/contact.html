<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
<a href="index.html">Home</a> |
<a href="skills.html">Skills</a> |
<a href="contact.html">Contact</a>
</nav>

<header>
    <h1>Contact</h1>
</header>

<main>
    <div class="row">
        <div class="col">
            <h2>Address</h2>
            <p>
                Syracuse University<br>
                Huntington Hall 030<br>
                Syracuse, NY 13244
            </p>
        </div>

        <div class="col">
            <h2>Email and LinkedIn</h2>
            <p><a href="mailto:bhvinal@syr.edu">bhvinal@syr.edu</a></p>
            <p>
                <a href="https://www.linkedin.com" target="_blank">
                    <img class="li-logo" src="../images/logo.png" alt="LinkedIn logo">
                    My LinkedIn Profile
                </a>
            </p>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <h2>Contact form</h2>
            <form class="contact-form" action="https://formspree.io/f/xkjgnnyv" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <p>Preferred contact method:</p>
                <input type="radio" id="email-pref" name="contact-method" value="email">
                <label class="radio-label" for="email-pref">Email</label>

                <input type="radio" id="phone-pref" name="contact-method" value="phone">
                <label class="radio-label" for="phone-pref">Phone</label>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6"></textarea>

                <input type="submit" value="Send message">
            </form>
        </div>

        <div class="col">
            <h2>Map</h2>
            <iframe
                class="map"
                title="Map of Huntington Hall, Syracuse University"
                src="https://maps.google.com/maps?q=900+South+Crouse+Avenue+Syracuse+NY+13244&amp;output=embed"
                allowfullscreen
                loading="lazy">
            </iframe>
        </div>
    </div>
</main>

</body>
</html>
